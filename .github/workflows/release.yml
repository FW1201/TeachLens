name: Release

# Push a tag such as v1.0.0 (or change VERSION on main) to build TeachLens and publish the DMG on
# GitHub Releases (the only distribution channel; no Mac App Store build).
on:
  push:
    tags: ["v*"]
    # Changing VERSION on main also publishes that version (tag + release).
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.0.0)"
        required: true
      publish:
        description: "Create the vVERSION tag and publish a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    # Xcode 26 builds the Liquid Glass code path; the app still runs on macOS 14+.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            VERSION="$(tr -d '[:space:]' < VERSION)"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Self-test
        run: swift run TeachLensSelfTest

      - name: Build universal app
        env:
          TEACHLENS_VERSION: ${{ steps.version.outputs.version }}
          TEACHLENS_BUNDLE_ID: io.github.fw1201.teachlens
          TEACHLENS_DISPLAY_NAME: TeachLens
        run: zsh Scripts/build-app.sh release

      - name: Create DMG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          zsh Scripts/make-dmg.sh ".build/TeachLens.app" "TeachLens $VERSION" ".build/TeachLens-$VERSION.dmg"
          shasum -a 256 ".build/TeachLens-$VERSION.dmg" | tee ".build/TeachLens-$VERSION.dmg.sha256"

      - name: Install and launch check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MNT="$(mktemp -d)"
          hdiutil attach ".build/TeachLens-$VERSION.dmg" -mountpoint "$MNT" -nobrowse -quiet
          ditto "$MNT/TeachLens.app" "/Applications/TeachLens.app"
          hdiutil detach "$MNT" -quiet
          open "/Applications/TeachLens.app"
          sleep 15
          pgrep -x TeachLens || { echo "::error::TeachLens did not stay running"; exit 1; }
          pkill -x TeachLens || true

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: TeachLens-${{ steps.version.outputs.version }}
          path: |
            .build/TeachLens-*.dmg
            .build/TeachLens-*.dmg.sha256

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event.inputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: TeachLens ${{ steps.version.outputs.version }}
          # Versions such as 1.3.0-beta.1 are published as pre-releases.
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          body: |
            ${{ contains(steps.version.outputs.version, '-') && '> **測試版（Beta）**：功能仍在實機驗收中，正式上課前請先在自己的 Mac 上試過一次。問題請回報到 GitHub Issues。' || '' }}

            ## 下載與安裝
            1. 下載 `TeachLens-${{ steps.version.outputs.version }}.dmg`，打開後把 TeachLens 拖到「應用程式」。
            2. 此版本未經 Apple 公證，第一次開啟會被擋下。請先雙擊一次，再到「系統設定 ▸ 隱私權與安全性」按 TeachLens 旁的「強制打開」；或在終端機執行：
               `xattr -dr com.apple.quarantine /Applications/TeachLens.app`
               （macOS 15 以後「右鍵 ▸ 打開」已無法略過，macOS 14 仍可用。）
            3. 依提示開啟「螢幕錄製」「輸入監控」「麥克風」「語音辨識」權限。

            需要 macOS 14 以上；macOS 26 以上會顯示 Liquid Glass 樣式。

            Fork 開發：[數位敘事力期刊](https://www.facebook.com/Journal.of.Digital.Narrative)　·　基於 ZoomIt for Mac（MIT）與 Keyviz（GPL-3.0）
          files: |
            .build/TeachLens-*.dmg
            .build/TeachLens-*.dmg.sha256
